services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: tourneyhub
      POSTGRES_USER: tourneyhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tourneyhub_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 images use /var/lib/postgresql/<major>/docker.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourneyhub -d tourneyhub"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    build: .
    image: tourneyhub-backend:local
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://tourneyhub:tourneyhub_local@postgres:5432/tourneyhub?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: tourneyhub-backend:local
    environment:
      HTTP_ADDRESS: ":8080"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:${SWAGGER_PORT:-8081}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://tourneyhub:tourneyhub_local@postgres:5432/tourneyhub?sslmode=disable}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  swagger:
    image: swaggerapi/swagger-ui:v5.32.0
    environment:
      URL: http://localhost:${API_PORT:-8080}/openapi.yaml
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
