name: Frontend
on:
  push:
    paths: ['frontend/**', 'backend/pkg/api/v1/openapi.yaml', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'backend/pkg/api/v1/openapi.yaml', '.github/workflows/frontend.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generate:api && git diff --exit-code -- src/api/schema.ts
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
