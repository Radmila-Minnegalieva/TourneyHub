name: tourneyhub

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: tourneyhub
      POSTGRES_USER: ${DB_USER:?Укажите DB_USER в .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Укажите DB_PASSWORD в .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Образ PostgreSQL 18 хранит данные в /var/lib/postgresql/<major>/docker.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    build: .
    image: tourneyhub-backend:local
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DB_USER: ${DB_USER:?Укажите DB_USER в .env}
      DB_PASSWORD: ${DB_PASSWORD:?Укажите DB_PASSWORD в .env}
      DB_HOST: postgres
      DB_PORT: "5432"
    volumes:
      - ./config:/app/config:ro
      - ./migrations:/app/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: tourneyhub-backend:local
    environment:
      HTTP_ADDRESS: ":8080"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:${SWAGGER_PORT:-8081}
      DB_USER: ${DB_USER:?Укажите DB_USER в .env}
      DB_PASSWORD: ${DB_PASSWORD:?Укажите DB_PASSWORD в .env}
      DB_HOST: postgres
      DB_PORT: "5432"
    volumes:
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  swagger:
    image: swaggerapi/swagger-ui:v5.32.0
    environment:
      URL: http://localhost:${API_PORT:-8080}/openapi.yaml
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
