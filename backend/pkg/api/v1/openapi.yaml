components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    '400':
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '401':
      description: Токен отсутствует, истёк или отозван
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '403':
      description: Недостаточно прав/учётная запись заблокирована
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: Ресурс не найден или скрыт от пользователя
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '409':
      description: Конфликт версии, состояния или уникальности
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '413':
      description: Файл/тело запроса слишком большой
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '415':
      description: Неподдерживаемый тип файла
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '422':
      description: Нарушение регламента или бизнес-правила
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '429':
      description: Слишком много запросов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: Число секунд до следующей попытки
          schema:
            type: integer
            minimum: 1
    '500':
      description: Внутренняя ошибка
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Role:
      type: string
      enum:
      - participant
      - organizer
      - referee
      - admin
    TournamentFormat:
      type: string
      enum:
      - single_elimination
      - round_robin
      - groups_playoffs
    TournamentStatus:
      type: string
      enum:
      - draft
      - registration
      - in_progress
      - completed
      - cancelled
    ApplicationStatus:
      type: string
      enum:
      - pending
      - accepted
      - rejected
      - withdrawn
    MatchStatus:
      type: string
      enum:
      - scheduled
      - awaiting_confirmation
      - disputed
      - completed
      - bye
    StageKind:
      type: string
      enum:
      - round_robin
      - groups
      - playoffs
    TieBreaker:
      type: string
      enum:
      - head_to_head
      - score_difference
      - score_for
      - elo
      - draw
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
          example: not_implemented
        message:
          type: string
          example: Операция ещё не реализована
        request_id:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      additionalProperties: false
      required:
      - field
      - message
      properties:
        field:
          type: string
        message:
          type: string
    VersionRequest:
      type: object
      additionalProperties: false
      required:
      - version
      properties:
        version:
          type: integer
          minimum: 1
          description: Версия записи для оптимистической блокировки. Устаревшая версия даёт 409.
    ReasonRequest:
      type: object
      additionalProperties: false
      required:
      - version
      - reason
      properties:
        version:
          type: integer
          minimum: 1
          description: Версия записи для оптимистической блокировки. Устаревшая версия даёт 409.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    TokenRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
    EmailRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      - nickname
      - personal_data_consent
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 72
          format: password
        nickname:
          type: string
          pattern: ^[A-Za-z0-9_]{3,32}$
        name:
          type: string
          minLength: 1
          maxLength: 120
        personal_data_consent:
          type: boolean
          enum:
          - true
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
      - token
      - password
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
    Tokens:
      type: object
      additionalProperties: false
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          enum:
          - 900
      description: 'Access: 15 минут; refresh: 30 дней. Refresh ротируется и отзывается при logout/reset password;
        сервер хранит только хеш.'
    PublicUser:
      type: object
      additionalProperties: false
      required:
      - id
      - nickname
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        name:
          type: string
        avatar_url:
          type: string
          format: uri
          maxLength: 2048
    Profile:
