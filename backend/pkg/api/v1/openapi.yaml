openapi: 3.0.3
info:
  title: TourneyHub Backend API
  version: 0.1.0
  description: >-
    API платформы TourneyHub для управления аккаунтами, командами, турнирами,
    заявками, расписанием матчей, результатами, спорами, рейтингами и уведомлениями.
    Идентификаторы передаются в формате UUID; даты — RFC3339 UTC.
    Пагинация использует limit/offset. По умолчанию сортировка стабильна:
    created_at DESC, id ASC. Доступ определяется ролями пользователя
    и его отношением к объекту; x-required-roles описывает необходимые роли.
    Обновления передают version и возвращают 409 при конфликте версий.
servers:
- url: /api/v1
tags:
- name: Auth
- name: Users
- name: Disciplines
- name: Teams
- name: Tournaments
- name: Applications
- name: Draw
- name: Matches
- name: Results
- name: Ratings
- name: Files
- name: Notifications
- name: Admin
security:
- BearerAuth: []
paths:
  /auth/register:
    post:
      operationId: register
      tags:
      - Auth
      summary: Регистрация с согласием на обработку данных
      description: Создаёт неподтверждённую учётную запись участника, отправляет одноразовую ссылку по e-mail. Роли
        organizer/referee выдаёт только администратор.
      responses:
        '202':
          description: Успешно
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags:
      - Auth
      summary: Подтвердить e-mail
      description: Подтвердить e-mail
      responses:
        '204':
          description: Успешно
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
  /auth/login:
    post:
      operationId: login
      tags:
      - Auth
      summary: Войти
      description: Вход только для подтверждённого и незаблокированного пользователя; не более 5 попыток/мин/IP.
        Неверные данные дают 401.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '401':
          $ref: '#/components/responses/401'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/refresh:
    post:
      operationId: refreshTokens
      tags:
      - Auth
      summary: Обновить и ротировать пару токенов
      description: Обновить и ротировать пару токенов
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '401':
          $ref: '#/components/responses/401'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
  /auth/logout:
    post:
      operationId: logout
      tags:
      - Auth
      summary: Отозвать refresh-сессию
      description: Отзывает сессию по refresh-токену; повторный выход идемпотентен.
      responses:
        '204':
          description: Успешно
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags:
      - Auth
      summary: Запросить восстановление пароля
      description: Всегда 202 независимо от наличия e-mail. Одноразовая ссылка действует 1 час.
      responses:
        '202':
          description: Успешно
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
  /auth/password-reset/confirm:
    post:
      operationId: resetPassword
      tags:
      - Auth
      summary: Установить новый пароль
      description: Использует одноразовый токен и отзывает все refresh-сессии.
      responses:
        '204':
          description: Успешно
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
  /users/me:
    get:
      operationId: getProfile
      tags:
      - Users
      summary: Текущий профиль
      description: Текущий профиль
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    patch:
      operationId: updateProfile
      tags:
      - Users
      summary: Редактировать профиль
      description: Редактировать профиль
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
  /users:
    get:
      operationId: searchUsers
      tags:
      - Users
      summary: Найти игроков по никнейму
      description: Возвращает только публичные поля; e-mail и роли не раскрываются.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: nickname
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 32
  /disciplines:
    get:
      operationId: listDisciplines
      tags:
      - Disciplines
      summary: Справочник активных дисциплин
      description: Справочник активных дисциплин
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisciplinePage'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      security: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
  /teams:
    get:
      operationId: listTeams
      tags:
      - Teams
      summary: Каталог команд
      description: Каталог команд
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPage'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      security: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 120
    post:
      operationId: createTeam
      tags:
      - Teams
      summary: Создать команду
      description: Создатель становится капитаном; размер состава проверяется при заявке на конкретную дисциплину.
      responses:
        '201':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      x-required-roles:
      - participant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
  /users/me/teams:
    get:
      operationId: listMyTeams
      tags:
      - Teams
      summary: Мои команды
      description: Мои команды
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
  /teams/{team_id}:
    get:
      operationId: getTeam
      tags:
      - Teams
      summary: Карточка команды
      description: Карточка команды
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      security: []
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateTeam
      tags:
      - Teams
      summary: Изменить команду
      description: Только капитан.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
    delete:
      operationId: deleteTeam
      tags:
      - Teams
      summary: Удалить команду
      description: Только капитан; мягкое удаление. Активные принятые заявки запрещают удаление (409); история матчей
        сохраняется.
      responses:
        '204':
          description: Успешно
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
  /teams/{team_id}/members:
    get:
      operationId: listTeamMembers
      tags:
      - Teams
      summary: Состав команды
      description: Состав команды
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      security: []
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /teams/{team_id}/members/{user_id}:
    delete:
      operationId: removeTeamMember
      tags:
      - Teams
      summary: Исключить игрока/покинуть команду
      description: Капитан исключает игрока или игрок выходит сам. Капитан сначала передаёт полномочия. Снимки составов
        заявок остаются неизменными.
      responses:
        '204':
          description: Успешно
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
  /teams/{team_id}/captain:
    put:
      operationId: transferCaptain
      tags:
      - Teams
      summary: Передать капитанство
      description: Только текущий капитан; получатель уже состоит в команде.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferCaptainRequest'
  /teams/{team_id}/invitations:
    post:
      operationId: createInvitation
      tags:
      - Teams
      summary: Пригласить игрока/создать одноразовую ссылку
      description: Только капитан; токен показывается один раз, в БД хранится хеш.
      responses:
        '201':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationLink'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
  /users/me/invitations:
    get:
      operationId: listMyInvitations
      tags:
      - Teams
      summary: Мои приглашения
      description: Мои приглашения
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
  /invitations/{invitation_id}/decision:
    post:
      operationId: decideInvitation
      tags:
      - Teams
      summary: Принять/отклонить приглашение
      description: Адресное приглашение доступно только приглашённому; ссылка одноразовая и проверяется атомарно.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - name: invitation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationDecisionRequest'
  /teams/{team_id}/invitations/{invitation_id}:
    delete:
      operationId: revokeInvitation
      tags:
      - Teams
      summary: Отозвать приглашение
      description: Только капитан.
      responses:
        '204':
          description: Успешно
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: invitation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /tournaments:
    get:
      operationId: listTournaments
      tags:
      - Tournaments
      summary: Публичный каталог турниров
      description: Скрытые турниры и черновики исключены; сортировка starts_at ASC NULLS LAST, id ASC; диапазон
        дат UTC.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentPage'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      security: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: discipline_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TournamentStatus'
      - name: format
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TournamentFormat'
      - name: starts_from
        in: query
        required: false
