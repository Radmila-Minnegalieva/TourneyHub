# Общие настройки сервиса. Секреты задаются через DB_USER и DB_PASSWORD.
http:
  address: ":8080"
  cors_origins:
    - http://localhost:5173
    - http://localhost:8081
  read_header_timeout: 5s
  read_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 10s
  sse_poll_interval: 1s
  sse_heartbeat_interval: 15s
  body_limit: 6M

public:
  web_url: http://localhost:5173

smtp:
  # Пустой адрес сохраняет письма в outbox до настройки SMTP.
  # SMTP_USER и SMTP_PASSWORD задаются только через окружение.
  address: ""
  from: noreply@tourneyhub.local
  allow_insecure: false
  dial_timeout: 10s
  timeout: 15s

worker:
  interval: 1m
  event_retention: 168h

database:
  host: localhost
  port: 5433
  name: tourneyhub
  ssl_mode: disable

migrations:
  # Путь относительно директории этого YAML-файла.
  directory: ../migrations
